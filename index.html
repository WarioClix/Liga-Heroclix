<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga HeroClix - Planeta Primate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#090d16',
                            card: '#111827',
                            accent: '#f59e0b', // Hero Yellow
                            red: '#ef4444',    // Hero Red
                            blue: '#3b82f6',   // Hero Blue
                            green: '#10b981',  // Victory Green
                            purple: '#a855f7'  // Admin Purple
                        }
                    },
                    fontFamily: {
                        comic: ['Bangers', 'cursive'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col selection:bg-brand-accent selection:text-black">

    <!-- Navbar con Logo -->
    <nav class="bg-brand-card border-b border-gray-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3">
                    <!-- LOGO DE PLANETA PRIMATE -->
                    <img src="Logo.png" alt="Planeta Primate Logo" class="h-12 w-12 object-contain rounded-lg bg-gray-800 p-1 border border-gray-700">
                    
                    <div>
                        <span class="text-3xl font-comic tracking-wider text-brand-accent drop-shadow">LIGA HEROCLIX</span>
                        <p class="text-xs text-gray-400 font-medium tracking-wide uppercase">Planeta Primate • 2026</p>
                    </div>
                </div>
                <!-- Menú de navegación principal -->
                <div class="hidden md:flex space-x-1">
                    <button onclick="switchTab('standings')" id="nav-standings" class="nav-btn px-3 py-2 rounded-lg text-sm font-semibold transition bg-brand-accent text-black"><i class="fa-solid fa-trophy mr-1.5"></i> Clasificación</button>
                    <button onclick="switchTab('rounds')" id="nav-rounds" class="nav-btn px-3 py-2 rounded-lg text-sm font-semibold transition text-gray-300 hover:text-white hover:bg-gray-800"><i class="fa-solid fa-calendar-days mr-1.5"></i> Jornadas</button>
                    <button onclick="switchTab('rules')" id="nav-rules" class="nav-btn px-3 py-2 rounded-lg text-sm font-semibold transition text-gray-300 hover:text-white hover:bg-gray-800"><i class="fa-solid fa-book-open mr-1.5"></i> Reglamento</button>
                    <button onclick="switchTab('admin')" id="nav-admin" class="nav-btn px-3 py-2 rounded-lg text-sm font-semibold transition text-gray-300 hover:text-white hover:bg-gray-800"><i class="fa-solid fa-gears mr-1.5"></i> Panel Admin</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal de la App -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="view-standings" class="view-section">
            <h1 class="text-4xl font-comic text-brand-accent mb-6">Clasificación General</h1>
            <div class="bg-brand-card p-6 rounded-xl border border-gray-800 shadow-xl">
                <p class="text-gray-400">La liga está vacía. Añade participantes desde el Panel de Administrador para ver la tabla.</p>
            </div>
        </div>
    </main>

    <footer class="bg-brand-card border-t border-gray-800 py-6 text-center text-sm text-gray-500">
        <p>Liga Oficial HeroClix - Organizada en colaboración con Planeta Primate.</p>
    </footer>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-brand-accent', 'text-black'));
            document.getElementById('nav-' + tabId).classList.add('bg-brand-accent', 'text-black');
        }
    </script>
</body>
</html>
